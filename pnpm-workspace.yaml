packages:
  - "packages/*"
  - "apps/*"
overrides:
  fast-uri: "^3.1.5"
  sharp: "^0.35.3"
  postcss: "^8.5.18"
  brace-expansion@1: "^1.1.17"
  brace-expansion@2: "^2.1.3"
  brace-expansion@5: "^5.0.8"
  undici@7: "^7.29.0"
  ip-address: "^10.3.1"
  js-yaml@3: "^3.15.1"
  js-yaml@4: "^4.3.1"
  nanoid: "^3.3.18"
auditConfig:
  ignoreGhsas:
    # image-size 2.0.3 (patched) is not published on npm yet; only
    # reachable via web-next's Storybook dev tooling (vite-plugin-storybook-nextjs),
    # not shipped to production. Remove once >=2.0.3 is available.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
allowBuilds:
  "@parcel/watcher": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  lmdb: true
  mongodb-memory-server: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@angular-devkit/architect@0.2200.6"
  - "@angular-devkit/core@22.0.6"
  - "@angular-devkit/schematics@22.0.6"
  - "@angular/build@22.0.6"
  - "@angular/cli@22.0.6"
  - "@schematics/angular@22.0.6"
  - fast-uri@3.1.5
